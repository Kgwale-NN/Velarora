# Free, disposable demonstration only. No paid resources are declared.
services:
  - type: web
    name: velarora-demo
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: STORAGE_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: VELARORA_CLOUD_DEMO
        value: "true"
      - key: OPEN_BROWSER
        value: "false"
